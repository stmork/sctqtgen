name: Yakindu SCT Qt5 Example Applications (qmake)
on: [push]

jobs:
   Build:
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v3
         - run: sudo apt update -y
         - name: Install needed components
           run: sudo apt install -y qtbase5-dev cppcheck
         - name: QMake
           run: qmake -r
         - name: Build
           run: make -j `nproc`
         - name: CPP-Check
           run: make cppcheck
